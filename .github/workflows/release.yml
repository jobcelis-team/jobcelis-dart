# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in pubspec.yaml when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into pubspec.yaml and commits it locally
#   3. analyzes it; publish.yml publishes the tag to pub.dev
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in pubspec.yaml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/jobcelis/versions/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.release == 'true'
        with:
          sdk: "3.3.0"

      - name: Analyze
        if: steps.check.outputs.release == 'true'
        run: dart pub get && dart analyze lib

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so start it here
      - name: Publish to pub.dev
        if: steps.v.outputs.release == 'true' && steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref "${{ steps.v.outputs.tag }}"
