# Publishes automatically when the version below changes on main:
#   1. reads the version from pubspec.yaml
#   2. if pub.dev does not have it yet, tags the commit (vX.Y.Z)
#   3. starts publish.yml on that tag, which publishes to pub.dev
# pub.dev only accepts publishing from a tag (automated publishing, no token),
# hence the two workflows.
# Bump the version in pubspec.yaml to release; any other change publishes nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Already released?
        id: check
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/jobcelis/versions/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.release == 'true'
        with:
          sdk: "3.3.0"

      - name: Analyze
        if: steps.check.outputs.release == 'true'
        run: dart pub get && dart analyze lib

      - name: Tag the release
        if: steps.check.outputs.release == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so start it here
      - name: Publish to pub.dev
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref "${{ steps.v.outputs.tag }}"
